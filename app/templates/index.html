<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GEX Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <h1>Stock GEX Viewer</h1>
    <form id="tickerForm">
        <label for="ticker">Enter Stock Ticker:</label>
        <input type="text" id="ticker" name="ticker" required>
        <button type="submit">Get Data</button>
    </form>

    <div id="controlsSection" style="margin-top: 20px; display: none;">
        <label for="expirationDate">Select Expiration Date(s):</label>
        <select id="expirationDate" multiple size="5" style="vertical-align: top;"></select>
        <button id="selectAllExpirations" type="button" style="vertical-align: top; margin-left: 5px;">Select All</button>
    </div>

    <div id="gexResult" style="margin-top: 10px;">
        <!-- GEX data table will be displayed here -->
    </div>

    <div id="chartContainer" style="width: 80%; max-width: 900px; margin: 20px auto; display: none;">
        <canvas id="gexChart"></canvas>
    </div>

    <script>
        const tickerForm = document.getElementById('tickerForm');
        const tickerInput = document.getElementById('ticker');
        const expirationSelect = document.getElementById('expirationDate');
        const controlsSection = document.getElementById('controlsSection');
        const gexResultDiv = document.getElementById('gexResult');
        const chartContainer = document.getElementById('chartContainer');
        const gexChartCanvas = document.getElementById('gexChart');

        let currentTicker = '';
        let currentExpirations = [];
        let gexChart = null; // To hold the chart instance

        async function fetchAndDisplayZeroGamma(ticker, expirations) {
            const zeroGammaResultDiv = document.getElementById('zeroGammaResult');
            if (!zeroGammaResultDiv) return;

            let url = new URL(window.location.origin + '/calculate_zero_gamma');
            url.searchParams.append('ticker', ticker);
            expirations.forEach(exp => url.searchParams.append('expiration', exp));

            try {
                const response = await fetch(url);
                const data = await response.json();
                let zGResultHtml = '';
                if (data.error) {
                    zGResultHtml = `<p><strong>Zero Gamma Level (Gamma Flip):</strong> <span style="color: red;">Error: ${data.error}</span></p>`;
                } else if (data.zero_gamma_level) {
                    zGResultHtml = `<p style="font-weight: bold; color: #0056b3;"><strong>Zero Gamma Level (Gamma Flip):</strong> $${data.zero_gamma_level.toFixed(2)}</p>`;
                } else {
                    zGResultHtml = `<p><strong>Zero Gamma Level (Gamma Flip):</strong> Not found in search range.</p>`;
                }
                zeroGammaResultDiv.innerHTML = zGResultHtml;
            } catch (error) {
                 zeroGammaResultDiv.innerHTML = `<p><strong>Zero Gamma Level (Gamma Flip):</strong> <span style="color: red;">Frontend error during calculation.</span></p>`;
            }
        }

        async function fetchAndDisplayGEX(ticker, expirations = []) {
            gexResultDiv.innerHTML = '<p>Fetching data... For new tickers, this may take a moment.</p>';

            let url = new URL(window.location.origin + '/gex');
            url.searchParams.append('ticker', ticker);
            expirations.forEach(exp => url.searchParams.append('expiration', exp));

            try {
                const response = await fetch(url);
                const data = await response.json();

                currentTicker = ticker; // Store current ticker

                if (data.error && !data.all_expiration_dates) { // Critical error, no dates
                    gexResultDiv.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
                    controlsSection.style.display = 'none';
                    return;
                }

                // Populate expiration dropdown if not already populated or if ticker changed
                // or if the provided list of expirations is different.
                if (data.all_expiration_dates &&
                    (currentExpirations.join(',') !== data.all_expiration_dates.join(','))) {
                    currentExpirations = data.all_expiration_dates;
                    expirationSelect.innerHTML = ''; // Clear existing options
                    if (currentExpirations.length === 0) {
                         gexResultDiv.innerHTML = `<p style="color: orange;">No option expiration dates found for ${data.ticker || ticker}.</p>`;
                         controlsSection.style.display = 'none';
                         return;
                    }
                    currentExpirations.forEach(exp => {
                        const option = document.createElement('option');
                        option.value = exp;
                        option.textContent = exp;
                        expirationSelect.appendChild(option);
                    });
                }

                // Handle single or multiple selected dates from backend
                const selectedDates = Array.isArray(data.selected_expiration_date) ? data.selected_expiration_date : [data.selected_expiration_date];

                if (selectedDates.length > 0 && currentExpirations.length > 0) {
                    Array.from(expirationSelect.options).forEach(opt => {
                        opt.selected = selectedDates.includes(opt.value);
                    });
                    controlsSection.style.display = 'block';
                } else if (currentExpirations.length === 0 && !data.error) {
                    // This case might happen if initial fetch had an error but then somehow recovered without dates
                     gexResultDiv.innerHTML = `<p style="color: orange;">No option expiration dates available for ${data.ticker || ticker}.</p>`;
                     controlsSection.style.display = 'none';
                     return;
                }


                if (data.error) { // Error specific to this expiration, but we might have dates
                    gexResultDiv.innerHTML = `<p style="color: red;">Error for ${data.ticker || ticker} (Exp: ${expiration || 'default'}): ${data.error}</p>`;
                    // Keep dropdown visible if dates were fetched
                    return;
                }


                let resultHtml = `<h3>${data.ticker} - GEX Data</h3>`;
                const selectedDates = Array.isArray(data.selected_expiration_date) ? data.selected_expiration_date : [data.selected_expiration_date];
                resultHtml += `<p><strong>Selected Expiration(s):</strong> ${selectedDates.join(', ')}</p>`;

                if (data.spot_price_used !== null && data.spot_price_used !== undefined) {
                    resultHtml += `<p><strong>Spot Price Used (latest):</strong> $${data.spot_price_used.toFixed(2)}</p>`;
                } else {
                    resultHtml += `<p><strong>Spot Price Used (latest):</strong> N/A</p>`;
                }
                resultHtml += `<p><strong>Risk-Free Rate Used (for calculation):</strong> ${(data.risk_free_rate_used * 100).toFixed(2)}%</p>`;

                resultHtml += `<div id="zeroGammaResult"><p>Calculating Zero Gamma Level...</p></div>`;

                if (data.data_source_timestamp) {
                    resultHtml += `<p><small><em>Data as of: ${new Date(data.data_source_timestamp).toLocaleString()}</em></small></p>`;
                }

                if (data.gex_by_strike && data.gex_by_strike.length > 0) {
                    resultHtml += `<h4>Totals for ${data.selected_expiration_date}:</h4>`;
                    // Add checks for null/undefined before calling toLocaleString
                    resultHtml += `<p><strong>Total Call GEX:</strong> $${(data.total_call_gex_usd ?? 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>`;
                    resultHtml += `<p><strong>Total Put GEX:</strong> $${(data.total_put_gex_usd ?? 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>`;
                    resultHtml += `<p><strong>Total Net GEX:</strong> $${(data.total_net_gex_usd ?? 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>`;

                    resultHtml += `<h4>GEX by Strike ($ per 1% move):</h4>`;
                    resultHtml += `<table border="1" style="width:100%; border-collapse: collapse;">
                                     <thead>
                                       <tr>
                                         <th>Strike</th>
                                         <th>Call GEX ($)</th>
                                         <th>Put GEX ($)</th>
                                         <th>Net GEX ($)</th>
                                       </tr>
                                     </thead>
                                     <tbody>`;
                    data.gex_by_strike.forEach(item => {
                        resultHtml += `<tr>
                                         <td>${item.strike.toFixed(2)}</td>
                                         <td>${item.call_gex_usd.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                         <td>${item.put_gex_usd.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                         <td style="font-weight: bold;">${item.net_gex_usd.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                       </tr>`;
                    });
                    resultHtml += `</tbody></table>`;
                } else {
                    resultHtml += `<p>No GEX data calculated for the selected criteria.</p>`;
                }

                if (data.calculation_notes) {
                    resultHtml += `<h5>Calculation Notes:</h5><ul>`;
                    data.calculation_notes.forEach(note => {
                        resultHtml += `<li><small><em>${note}</em></small></li>`;
                    });
                    resultHtml += `</ul>`;
                }
                gexResultDiv.innerHTML = resultHtml;

                // Charting logic
                // ... (rest of charting logic) ...

                // After rendering main data, kick off the zero gamma calculation
                if (!data.error) {
                    fetchAndDisplayZeroGamma(ticker, selectedDates);
                }


                if (gexChart) {
                    gexChart.destroy(); // Destroy previous chart instance
                    gexChart = null;
                }

                if (data.gex_by_strike && data.gex_by_strike.length > 0) {
                    chartContainer.style.display = 'block';
                    const strikes = data.gex_by_strike.map(item => item.strike.toFixed(2));
                    const callGEXData = data.gex_by_strike.map(item => item.call_gex_usd);
                    const putGEXData = data.gex_by_strike.map(item => -item.put_gex_usd); // Negate for downward plot
                    const netGEXData = data.gex_by_strike.map(item => item.net_gex_usd);
                    const callOiData = data.gex_by_strike.map(item => item.call_oi);
                    const putOiData = data.gex_by_strike.map(item => item.put_oi);

                    gexChart = new Chart(gexChartCanvas, {
                        type: 'bar',
                        data: {
                            labels: strikes,
                            datasets: [
                                {
                                    label: 'Call GEX ($)',
                                    data: callGEXData,
                                    backgroundColor: 'rgba(75, 192, 192, 0.6)',
                                    borderColor: 'rgba(75, 192, 192, 1)',
                                    borderWidth: 1
                                },
                                {
                                    label: 'Put GEX ($)',
                                    data: putGEXData, // Now contains negative values
                                    backgroundColor: 'rgba(255, 99, 132, 0.6)',
                                    borderColor: 'rgba(255, 99, 132, 1)',
                                    borderWidth: 1
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: {
                                    stacked: true, // Stack bars on the same category
                                    title: { display: true, text: 'Strike Price' }
                                },
                                y: {
                                    stacked: false,
                                    title: { display: true, text: 'Gamma Exposure ($ Amount)' },
                                    ticks: {
                                        callback: function(value, index, values) {
                                            // Show absolute values on the y-axis ticks
                                            return '$' + Math.abs(value).toLocaleString();
                                        }
                                    }
                                }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: `GEX Profile for ${data.ticker} - Exp: ${data.selected_expiration_date}`
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed.y !== null) {
                                                // Show absolute value in tooltip
                                                label += '$' + Math.abs(context.parsed.y).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                                            }
                                            return label;
                                        },
                                        footer: function(tooltipItems) {
                                            const dataIndex = tooltipItems[0].dataIndex;
                                            const netGexValue = netGEXData[dataIndex];
                                            const callOiValue = callOiData[dataIndex];
                                            const putOiValue = putOiData[dataIndex];

                                            const netGexLine = 'Net GEX: $' + netGexValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                                            const callOiLine = 'Call OI: ' + callOiValue.toLocaleString();
                                            const putOiLine = 'Put OI: ' + putOiValue.toLocaleString();

                                            return [netGexLine, callOiLine, putOiLine];
                                        }
                                    }
                                }
                            }
                        }
                    });
                } else {
                    chartContainer.style.display = 'none'; // Hide chart if no data
                }

            } catch (error) {
                console.error("Frontend error:", error);
                gexResultDiv.innerHTML = `<p style="color: red;">Frontend error: ${error.message}. Check console for details.</p>`;
                controlsSection.style.display = 'none';
                chartContainer.style.display = 'none';
            }
        }

        tickerForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const ticker = tickerInput.value.trim().toUpperCase();
            if (ticker) {
                currentExpirations = []; // Reset expirations
                chartContainer.style.display = 'none';
                controlsSection.style.display = 'none';
                // Fetch with no specific expiration, backend will default to first available
                fetchAndDisplayGEX(ticker, []);
            }
        });

        expirationSelect.addEventListener('change', function() {
            if (currentTicker) {
                const selectedExpirations = Array.from(expirationSelect.selectedOptions).map(opt => opt.value);
                if (selectedExpirations.length > 0) {
                    fetchAndDisplayGEX(currentTicker, selectedExpirations);
                }
            }
        });

        document.getElementById('selectAllExpirations').addEventListener('click', function() {
            Array.from(expirationSelect.options).forEach(opt => opt.selected = true);
            // Manually trigger the change event to reload data
            expirationSelect.dispatchEvent(new Event('change'));
        });
    </script>
</body>
</html>
